[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-locator"
version = "1.0.0"
description = "Locate the first frame in a video where a given spoken dialogue occurs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.3",
    "rapidfuzz>=3.9",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    # 1.x FaceDetector aborts on macOS (Metal helper init fails), hence the <1.0 pin
    "mediapipe>=0.10.14,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
dialogue-locator = "dialogue_locator.cli:main"
dialogue-locator-server = "dialogue_locator.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dialogue_locator*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
# -ra: summary of skipped/failed reasons at the end
addopts = "-ra"
# Live logging: every logger.info()+ from the modules under test streams to the
# terminal while the tests run, grouped per test under "live log setup/call".
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d %(levelname)-7s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
# Captured logs (shown in the failure report) keep DEBUG for post-mortem detail.
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d %(levelname)-7s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
