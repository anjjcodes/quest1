[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-locator"
version = "1.0.0"
description = "Locate the first frame in a video where a given spoken dialogue occurs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.3",
    "rapidfuzz>=3.9",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
dialogue-locator = "dialogue_locator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dialogue_locator*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
log_cli = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
